[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-vision-pipeline"
version = "0.1.0"
description = "Real-time video analytics service: detection, tracking and rule-based events from RTSP cameras."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robin" }]
dependencies = [
    "rtsp-supervisor[opencv] @ git+https://github.com/RobinChiHsu/rtsp-supervisor@v0.1.0",
    "typed-mqtt-bus[aiomqtt] @ git+https://github.com/RobinChiHsu/typed-mqtt-bus@v0.1.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]

[project.scripts]
edge-vision = "edge_vision.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/edge_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=edge_vision --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/helpers.py" = ["ASYNC110"]
